name: Stage 5a comparator benchmark (MINT vs EBICglasso)

# Manual trigger only -- this is a heavy, one-off evidence-generation run
# for docs/stage5a_charter.md, not something to fire on every push. Each
# of the 35 (dgp, N) cells runs as its own matrix job (its own isolated
# runner, no shared cores), which avoids the BLAS-thread oversubscription
# that made a single-machine, multi-process run of this same workload
# slower than expected locally. A final job aggregates every shard's
# raw_metrics.csv and produces the same report a local unsharded run
# would produce, since each shard's seeds are derived from the full
# DGP/N grid index, not the shard's own subset (see
# mintnet.experiments.stage5a.run_stage5a's own docstring).

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Stage 5a config file to run"
        required: false
        default: "configs/stage5a_comparator_benchmark.yaml"

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        dgp:
          - chain_fork_hub
          - overlap
          - triangle_balanced
          - triangle_moderate
          - triangle_strong
        n: [400, 500, 600, 750, 1000, 1500, 1750]
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: >
          python -m mintnet.experiments.stage5a
          --config "${{ github.event.inputs.config || 'configs/stage5a_comparator_benchmark.yaml' }}"
          --output results/generated/stage5a_shard
          --dgps "${{ matrix.dgp }}"
          --sample-sizes "${{ matrix.n }}"
          --no-report
      - uses: actions/upload-artifact@v4
        with:
          name: "shard-${{ matrix.dgp }}-${{ matrix.n }}"
          path: results/generated/stage5a_shard
          retention-days: 14

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: "shard-*"
          path: shards
      - run: >
          python scripts/aggregate_stage5a.py
          --config "${{ github.event.inputs.config || 'configs/stage5a_comparator_benchmark.yaml' }}"
          --shards-dir shards
          --output results/generated/stage5a_comparator_benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: stage5a-comparator-benchmark
          path: results/generated/stage5a_comparator_benchmark
          retention-days: 90
